name: RokhpadBot

# Hands-off runtime: no human or model should need to click Run workflow.
#
# Why GitHub Actions: api.telegram.org is unreachable from Iran; runners are outside.
#
# Design:
# - One long-polling session ~5h50m (under the 6h job limit).
# - Cron every hour. While a session is alive, concurrency keeps only one poller;
#   at most one follow-up run stays pending and starts when the current session ends.
# - That makes restart automatic: end of session → pending/next hourly tick → new session.
# - push/workflow_dispatch remain for emergency use only, not for normal operation.
#
# Honest limit: GitHub may delay schedule triggers under load. Hourly ticks minimize
# the blind gap. This is not a paid always-on VPS SLA.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: rokhpadbot-poller
  cancel-in-progress: false

jobs:
  run-bot:
    name: Run bot (polling session)
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bot credentials (getMe)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python test_bot.py

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          timeout --signal=INT 21000 python rokbot.py || true

      - name: Session summary
        if: always()
        run: |
          echo "Session finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Hands-off mode: hourly schedule + concurrency should start the next session without manual Run."
          echo "The database is intentionally ephemeral: no visitor data is ever committed."
